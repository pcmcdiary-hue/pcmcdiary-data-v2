name: Sync Google Sheet to JSON

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run sync script
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: npm run sync

      - name: Commit and push
        run: |
          git config user.name "pcmcdiary-bot"
          git config user.email "bot@pcmcdiary.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-sync: $(date -u +%Y-%m-%d_%H:%M)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
